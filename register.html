<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Register for Awesome Group information system"><title>Register | Awesome Group Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="assets/js/main.js" defer></script>
</head>
<body data-page="register">
<header data-site-header></header><main>
<section class="auth-layout register-layout">
    <div class="auth-intro"><span class="eyebrow light">Join the workspace</span><h1>One account. Better teamwork.</h1><p>Create your account to manage Awesome Group’s company records in this browser.</p></div>
    <form class="auth-card" id="register-form"><span class="eyebrow">Create account</span><h2>Get started today</h2><div class="error-box" id="register-error" hidden></div><label>Full name<input name="fullName" required autocomplete="name" placeholder="Your full name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="name@company.com"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="button primary full" type="submit">Create account →</button><p class="form-switch">Already registered? <a href="login.html">Sign in</a></p></form>
</section>
</main><footer data-site-footer></footer>
</body></html>
